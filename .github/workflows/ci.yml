name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
  isa-rewrite:
    # C++ unit tests for plugin/Qasm2ToIsa.h. Needs no CUDA-Q: the rewrite
    # is a pure function, proven against textbook gate matrices.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -I plugin plugin/tests/test_qasm2_to_isa.cpp -o test_isa
      - run: ./test_isa
  layout:
    # C++ unit tests for plugin/Layout.h (M3 routing). Pure functions; reads
    # the ibm_fez wiring from tests/data, so it runs from the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -I plugin plugin/tests/test_layout.cpp -o test_layout
      - run: ./test_layout
  result-bits:
    # C++ unit tests for plugin/ResultBits.h (IBM samples -> CUDA-Q bits).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror -I plugin plugin/tests/test_result_bits.cpp -o test_result_bits
      - run: ./test_result_bits
  chip-data:
    # C++ unit tests for plugin/ChipData.h (IBM JSON -> chip, fail closed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - run: g++ -std=c++20 -Wall -Wextra -Werror -I plugin plugin/tests/test_chip_data.cpp -o test_chip_data
      - run: ./test_chip_data
  plugin:
    # The C++ plugin itself: built against the pip wheel, without a CUDA-Q
    # source build (plugin/build_against_wheel.sh), then run end to end
    # against the fake IBM server. Never touches IBM. One run per cudaq
    # release the plugin supports.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cudaq-version: ["0.16.0", "0.16.0.post1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cudaq==${{ matrix.cudaq-version }}" fastapi uvicorn python-multipart
      - run: plugin/build_against_wheel.sh
      - name: Run the six cases against the fake IBM server
        run: |
          python tests/fake_ibm_server.py 62455 > fake-server.log 2>&1 &
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/62455) 2>/dev/null && break
            sleep 0.5
          done
          python tests/run_fake_ibm.py
      - name: Compare results with CUDA-Q's simulator (simulating fake server)
        run: python tests/run_fake_ibm_results.py
      - name: Fake server log
        if: always()
        run: cat fake-server.log
