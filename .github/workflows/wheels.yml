name: wheels
# The wheel of the C++ plugin, for Linux x86_64 and aarch64
# (docs/development.md, section 7).
#
#   build:   plugin/build_wheel.sh inside the manylinux_2_28 image, so the
#            library loads on every Linux that pip cudaq supports;
#   test:    plugin/test_wheel.sh installs that wheel next to pip cudaq in a
#            fresh environment and runs the fake-server tests with it, on the
#            oldest system the wheel claims and on a current one;
#   release: only for a tag "v<version>": the tested wheels go to a GitHub
#            Release.
#
# Nothing here touches IBM.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new commit on a pull request replaces the run of the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The wheel is built against the oldest cudaq release it supports and
  # tested against every one (plugin/packaging/pyproject.toml, dependencies).
  CUDAQ_BUILD_VERSION: "0.16.0"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the wheel in the manylinux_2_28 image
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            -e PYTHON=/opt/python/cp312-cp312/bin/python \
            -e CUDAQ_IBM_REQUIRE_PORTABLE=1 \
            -e CUDAQ_BUILD_VERSION \
            quay.io/pypa/manylinux_2_28_${{ matrix.arch }} \
            bash -c 'set -euo pipefail
                     git config --global --add safe.directory "*"
                     g++ --version | head -1
                     ldd --version | head -1
                     $PYTHON -m pip install --quiet "cudaq==$CUDAQ_BUILD_VERSION"
                     plugin/build_wheel.sh dist'
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: test (${{ matrix.arch }}, ${{ matrix.system }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        system: [oldest, current]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          # oldest: glibc 2.28 (the manylinux_2_28 image itself), the oldest
          # Python and the oldest cudaq the wheel supports.
          - system: oldest
            cudaq: "0.16.0"
          # current: the runner's Ubuntu, the newest Python and the newest
          # cudaq the wheel supports.
          - system: current
            cudaq: "0.16.0.post1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.arch }}
          path: dist
      - name: Test on the oldest supported system
        if: matrix.system == 'oldest'
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            -e PYTHON=/opt/python/cp311-cp311/bin/python \
            quay.io/pypa/manylinux_2_28_${{ matrix.arch }} \
            bash -c 'plugin/test_wheel.sh dist/*.whl "${{ matrix.cudaq }}"'
      - uses: actions/setup-python@v5
        if: matrix.system == 'current'
        with:
          python-version: "3.14"
      - name: Test on a current system
        if: matrix.system == 'current'
        run: plugin/test_wheel.sh dist/*.whl "${{ matrix.cudaq }}"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: The tag must be "v" + the version in the wheels
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          for arch in x86_64 aarch64; do
            wheel="dist/cudaq_ibm-${version}-py3-none-manylinux_2_28_${arch}.whl"
            test -f "$wheel" || {
              echo "error: no $wheel. Does the tag match the version in" \
                   "plugin/packaging/pyproject.toml?"; exit 1; }
          done
      - name: Create the release with the two wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A version with letters (0.1.0rc1) is a pre-release.
          prerelease=""
          if [[ "$version" =~ [a-z] ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "cudaq-ibm $version" --generate-notes --verify-tag \
            $prerelease
